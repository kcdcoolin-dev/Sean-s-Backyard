{% extends "base.html" %}
{% from "parts.html" import post_rows %}
{% block title %}Blog · {{ site.title }}{% endblock %}
{% block main %}
<section class="wrap section">
  <h1 class="display page-title">Blog</h1>
  {% if posts %}
  {{ post_rows(posts, root) }}
  {% else %}
  <p class="empty">No posts yet.</p>
  {% endif %}
</section>
{% endblock %}
